name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,server]"
      - name: Lint
        run: ruff check .
      # includes server/tests (review service, fake pipeline) and the check that web/src/api/openapi.json is current
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q pipeline server
      # Runtime dependencies only (a fresh venv with the `server` extra, without the dev tools): every SPDX identifier must be on the allowlist
      # in tools/check_licenses.py (permissive, commercial use); GPL, AGPL, LGPL, MPL, non-commercial and unknown fail.
      - name: License scan
        run: |
          python -m venv runtime
          if [ -d runtime/Scripts ]; then BIN=runtime/Scripts; else BIN=runtime/bin; fi
          "$BIN/python" -m pip install ".[server]" "pip-licenses>=4.4"
          "$BIN/pip-licenses" --from=mixed --format=json > runtime/licenses.json
          "$BIN/python" tools/check_licenses.py runtime/licenses.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # every production package in the lockfile (all platforms) must have an allowlisted SPDX license
      - name: License scan
        run: npm run licenses
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # src/api/schema.d.ts must be what openapi-typescript makes of the committed OpenAPI document
      - name: API types
        run: npm run api:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
