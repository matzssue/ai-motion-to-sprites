name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      # Runtime dependencies only (a fresh venv without the dev tools): GPL, AGPL and non-commercial licenses fail.
      - name: License scan
        env:
          ALLOWED: "MIT;MIT License;MIT-CMU;HPND;BSD License;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache Software License;ISC;PSF-2.0;Python Software Foundation License"
        run: |
          python -m venv runtime
          if [ -d runtime/Scripts ]; then BIN=runtime/Scripts; else BIN=runtime/bin; fi
          "$BIN/python" -m pip install . "pip-licenses>=4.4"
          "$BIN/pip-licenses" --from=mixed --allow-only="$ALLOWED"
