[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-motion-to-sprites"
version = "0.1.0"
description = "Text-to-motion for 2D games: generated 3D character to an animated, audited GLB for 8-direction sprites."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Host Python only (auto-rig, alpha check, review page, tests). Blender and Kimodo bring their own interpreters.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.5",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "pip-licenses>=4.4",
]

[project.urls]
Repository = "https://github.com/matzssue/ai-motion-to-sprites"

# Scripts stay where they are (run by path); installing the project only pulls the dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
