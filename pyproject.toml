[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-motion-to-sprites"
version = "0.2.0"
description = "Text-to-motion for 2D games: generated 3D character to an animated, audited GLB for 8-direction sprites."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Host Python only (auto-rig, alpha check, review page, tests). Blender and Kimodo bring their own interpreters.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.5",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "pip-licenses>=4.4",
    # Starlette's TestClient (server/tests); test-only, so it stays out of the `server` extra and its license gate
    "httpx2>=2.14",
]
# local review service (server/README.md)
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/matzssue/ai-motion-to-sprites"

# Scripts stay where they are (run by path); installing the project only pulls the dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
extend-exclude = [".venv", "runtime"]

[tool.ruff.lint]
# real errors only: pyflakes and syntax errors. The dense style (semicolon chains, one-line ifs, lambdas, `l` names,
# long lines) is deliberate. bpy/mathutils are never imported by ruff, so the host needs no Blender.
select = ["F", "E9"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
